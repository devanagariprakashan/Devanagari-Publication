<svg width="600" height="850" viewBox="0 0 600 850" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="850" rx="8" fill="#FDFCF7"/>
  <rect x="25" y="25" width="550" height="800" rx="4" fill="#FFFFFF" stroke="#EAE6DF" stroke-width="1.5"/>
  
  <!-- Book Header -->
  <line x1="60" y1="70" x2="540" y2="70" stroke="#C61821" stroke-width="2"/>
  <text x="60" y="60" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="bold" fill="#C61821">निबंध संहिता — MPPSC मुख्य परीक्षा</text>
  <text x="540" y="60" text-anchor="end" font-family="sans-serif" font-size="12" fill="#78716C">अनुक्रमणिका (Table of Contents)</text>

  <!-- Title -->
  <text x="300" y="115" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="800" fill="#1C1917">विषय सूची एवं अध्याय विवरण</text>
  <line x1="220" y1="128" x2="380" y2="128" stroke="#E7E5E4" stroke-width="1.5"/>

  <!-- Contents Table -->
  <!-- Section 1 -->
  <rect x="60" y="150" width="480" height="30" rx="4" fill="#FBF3F3"/>
  <text x="75" y="170" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="bold" fill="#C61821">खंड 1 : राष्ट्रीय एवं अंतर्राष्ट्रीय समसामयिक परिदृश्य</text>
  <text x="525" y="170" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C61821">पृष्ठ संख्या</text>

  <!-- Rows -->
  <g font-family="'Noto Sans Devanagari', sans-serif" font-size="12" fill="#292524">
    <text x="75" y="205">1.1 विकसित भारत @2047: चुनौतियाँ एवं अवसर</text>
    <line x1="330" y1="202" x2="500" y2="202" stroke="#D6D3D1" stroke-dasharray="3 3"/>
    <text x="530" y="205" text-anchor="end" font-family="sans-serif">01-14</text>

    <text x="75" y="235">1.2 डिजिटल इंडिया एवं आर्टिफिशियल इंटेलिजेंस (AI) क्रांति</text>
    <line x1="375" y1="232" x2="500" y2="232" stroke="#D6D3D1" stroke-dasharray="3 3"/>
    <text x="530" y="235" text-anchor="end" font-family="sans-serif">15-28</text>

    <text x="75" y="265">1.3 जलवायु परिवर्तन एवं भारत की नवीकरणीय ऊर्जा नीतियां</text>
    <line x1="380" y1="262" x2="500" y2="262" stroke="#D6D3D1" stroke-dasharray="3 3"/>
    <text x="530" y="265" text-anchor="end" font-family="sans-serif">29-42</text>

    <text x="75" y="295">1.4 भारत की विदेश नीति: वैश्विक दक्षिण (Global South) का नेतृत्व</text>
    <line x1="420" y1="292" x2="500" y2="292" stroke="#D6D3D1" stroke-dasharray="3 3"/>
    <text x="530" y="295" text-anchor="end" font-family="sans-serif">43-56</text>
  </g>

  <!-- Section 2 -->
  <rect x="60" y="325" width="480" height="30" rx="4" fill="#FBF3F3"/>
  <text x="75" y="345" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="bold" fill="#C61821">खंड 2 : सामाजिक न्याय, महिला सशक्तिकरण एवं शिक्षा</text>
  <text x="525" y="345" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C61821">पृष्ठ संख्या</text>

  <g font-family="'Noto Sans Devanagari', sans-serif" font-size="12" fill="#292524">
    <text x="75" y="380">2.1 नारी शक्ति वंदन अधिनियम एवं राजनीतिक प्रतिनिधित्व</text>
    <line x1="370" y1="377" x2="500" y2="377" stroke="#D6D3D1" stroke-dasharray="3 3"/>
    <text x="530" y="380" text-anchor="end" font-family="sans-serif">57-70</text>

    <text x="75" y="410">2.2 राष्ट्रीय शिक्षा नीति (NEP 2020): क्रियान्वयन एवं सुधार</text>
    <line x1="380" y1="407" x2="500" y2="407" stroke="#D6D3D1" stroke-dasharray="3 3"/>
    <text x="530" y="410" text-anchor="end" font-family="sans-serif">71-84</text>

    <text x="75" y="440">2.3 जनजातीय कल्याण: सांस्कृतिक धरोहर एवं आर्थिक समावेशन</text>
    <line x1="405" y1="437" x2="500" y2="437" stroke="#D6D3D1" stroke-dasharray="3 3"/>
    <text x="530" y="440" text-anchor="end" font-family="sans-serif">85-98</text>
  </g>

  <!-- Section 3 -->
  <rect x="60" y="470" width="480" height="30" rx="4" fill="#FBF3F3"/>
  <text x="75" y="490" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="bold" fill="#C61821">खंड 3 : मध्य प्रदेश विशेष समसामयिक निबंध</text>
  <text x="525" y="490" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C61821">पृष्ठ संख्या</text>

  <g font-family="'Noto Sans Devanagari', sans-serif" font-size="12" fill="#292524">
    <text x="75" y="525">3.1 मध्य प्रदेश में कृषि अधोसंरचना एवं खाद्य प्रसंस्करण</text>
    <line x1="365" y1="522" x2="500" y2="522" stroke="#D6D3D1" stroke-dasharray="3 3"/>
    <text x="530" y="525" text-anchor="end" font-family="sans-serif">99-112</text>

    <text x="75" y="555">3.2 म.प्र. में पर्यटन विकास: महाकाल लोक एवं ओंकारेश्वर कॉरिडोर</text>
    <line x1="410" y1="552" x2="500" y2="552" stroke="#D6D3D1" stroke-dasharray="3 3"/>
    <text x="530" y="555" text-anchor="end" font-family="sans-serif">113-126</text>

    <text x="75" y="585">3.3 लाड़ली बहना योजना: आर्थिक संबल एवं सामाजिक प्रभाव</text>
    <line x1="375" y1="582" x2="500" y2="582" stroke="#D6D3D1" stroke-dasharray="3 3"/>
    <text x="530" y="585" text-anchor="end" font-family="sans-serif">127-140</text>
  </g>

  <!-- Bottom Tip Box -->
  <rect x="60" y="640" width="480" height="110" rx="6" fill="#F5F5F4" stroke="#E7E5E4"/>
  <text x="80" y="668" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="bold" fill="#C61821">★ मुख्य परीक्षा निबंध लेखन रणनीति सूत्र:</text>
  <text x="80" y="692" font-family="'Noto Sans Devanagari', sans-serif" font-size="11" fill="#57534E">1. प्रस्तावना (Introduction): विषय का ऐतिहासिक व समकालीन संदर्भ स्पष्ट करें।</text>
  <text x="80" y="712" font-family="'Noto Sans Devanagari', sans-serif" font-size="11" fill="#57534E">2. मुख्य भाग (Body): 360° आयाम (राजनीतिक, आर्थिक, सामाजिक, तकनीकी, पर्यावरण)।</text>
  <text x="80" y="732" font-family="'Noto Sans Devanagari', sans-serif" font-size="11" fill="#57534E">3. निष्कर्ष (Conclusion): आशावादी, समाधानपरक एवं राष्ट्रहित से ओत-प्रोत विज़न।</text>

  <!-- Page Footer -->
  <line x1="60" y1="785" x2="540" y2="785" stroke="#E7E5E4" stroke-width="1"/>
  <text x="300" y="805" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78716C">iii</text>
</svg>
